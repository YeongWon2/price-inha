[package]
name = "pi-exec"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
thiserror = "2.0.21"
pi-paper = { path = "../paper" }
pi-market = { path = "../market" }
pi-store = { path = "../store" }
pi-rules = { path = "../rules" }
pi-approval = { path = "../approval" }
async-trait = "0.1.92"
chrono = { version = "0.4.45", default-features = false, features = ["std"] }
rust_decimal = "1.43.0"
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["sync"] }

[dev-dependencies]
rusqlite = { version = "0.42.0", features = ["bundled"] }
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["rt", "macros", "sync"] }
