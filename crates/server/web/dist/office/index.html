<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>가격인하 사무실</title>
  <script type="module" crossorigin src="/assets/office-f87bwx2i.js"></script>
  <link rel="modulepreload" crossorigin href="/assets/menu-ijsrwa1d.js">
  <link rel="stylesheet" crossorigin href="/assets/menu-gyo1roft.css">
  <link rel="stylesheet" crossorigin href="/assets/office-ftrm4pu5.css">
</head>
<body>
<div id="app">
  <header id="bar">
    <div id="menu" data-screen="office"></div>
    <strong>가격인하 사무실</strong>
    <span id="conn" class="conn" data-state="wait" role="status" aria-live="polite">잇는 중</span>
    <button id="look-toggle" type="button">담당 외형</button>
    <button id="view-toggle" type="button" hidden>가벼운 화면</button>
  </header>
  <main id="main">
    <section id="stage" aria-label="3D 사무실">
      <div id="canvas-host"></div>
      <div id="labels" aria-hidden="true"></div>
      <div id="stage-note" class="note" hidden></div>
      <button id="recenter" type="button" hidden>처음 화면으로</button>
      <div id="caption" class="caption" role="status" aria-live="polite" hidden></div>
      <button id="auto-camera" type="button" aria-pressed="true" hidden>자동 카메라 켜짐</button>
    </section>
    <section id="looks" aria-label="담당 외형 고르기" hidden></section>
    <section id="light" aria-label="담당 목록" hidden>
      <ul id="light-list"></ul>
    </section>
    <aside id="chat" aria-label="사무실 채팅">
      <section id="approvals" aria-label="승인 요청" aria-live="polite"></section>
      <nav id="chat-tabs" role="tablist"></nav>
      <div id="speaking" class="speaking" role="status" aria-live="polite" hidden></div>
      <div id="chat-log" role="log" aria-live="polite"></div>
      <form id="chat-form" autocomplete="off">
        <label id="chat-to-wrap" for="chat-to">받는 담당
          <select id="chat-to"></select>
        </label>
        <textarea id="chat-input" rows="2" maxlength="1000" placeholder="담당에게 묻기 (Enter 보내기, Shift+Enter 줄바꿈)"></textarea>
        <button id="chat-send" type="submit">보내기</button>
      </form>
    </aside>
  </main>
</div>
</body>
</html>
