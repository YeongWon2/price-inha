<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>가격인하 · 키 등록</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 0 auto; max-width: 28rem; padding: 1rem; }
  label { display: block; margin-top: .75rem; font-size: .9rem; }
  input { box-sizing: border-box; width: 100%; padding: .5rem; font-size: 1rem; }
  button { margin-top: .75rem; padding: .5rem 1rem; font-size: 1rem; }
  .item { border-top: 1px solid #ddd; margin-top: 1rem; padding-top: .5rem; }
  .msg { display: block; margin-top: .5rem; font-size: .9rem; }
  .hint { color: #666; font-size: .85rem; }
</style>
</head>
<body>
  <h1>키 등록</h1>
  <p class="hint">이 화면은 키를 저장만 합니다. 등록한 키 값은 다시 보여 주지 않습니다.</p>

  <div class="item">
    <h2>증권사 키</h2>
    <label for="k-client-id">client_id</label>
    <input id="k-client-id" type="password" autocomplete="new-password" spellcheck="false">
    <label for="k-client-secret">client_secret</label>
    <input id="k-client-secret" type="password" autocomplete="new-password" spellcheck="false">
    <button id="k-broker" type="button">증권사 키 등록</button>
    <span id="k-broker-msg" class="msg" aria-live="polite"></span>
  </div>

  <div class="item">
    <h2>AI 키</h2>
    <label for="k-api-key">api_key</label>
    <input id="k-api-key" type="password" autocomplete="new-password" spellcheck="false">
    <button id="k-ai" type="button">AI 키 등록</button>
    <span id="k-ai-msg" class="msg" aria-live="polite"></span>
  </div>

  <div class="item">
    <h2>DART 키 (공시 · 재무) <span id="k-slot-dart-reg" class="hint"></span></h2>
    <label for="k-slot-dart">api_key</label>
    <input id="k-slot-dart" type="password" autocomplete="new-password" spellcheck="false">
    <button id="k-slot-dart-button" type="button">등록</button>
    <span id="k-slot-dart-msg" class="msg" aria-live="polite"></span>
  </div>

  <div class="item">
    <h2>ECOS 키 (한국은행 통계) <span id="k-slot-ecos-reg" class="hint"></span></h2>
    <label for="k-slot-ecos">api_key</label>
    <input id="k-slot-ecos" type="password" autocomplete="new-password" spellcheck="false">
    <button id="k-slot-ecos-button" type="button">등록</button>
    <span id="k-slot-ecos-msg" class="msg" aria-live="polite"></span>
  </div>

  <div class="item">
    <h2>FRED 키 (미국 금리) <span id="k-slot-fred-reg" class="hint"></span></h2>
    <label for="k-slot-fred">api_key</label>
    <input id="k-slot-fred" type="password" autocomplete="new-password" spellcheck="false">
    <button id="k-slot-fred-button" type="button">등록</button>
    <span id="k-slot-fred-msg" class="msg" aria-live="polite"></span>
  </div>

  <div class="item">
    <h2>백업 GitHub 토큰 <span id="k-slot-backup_github_token-reg" class="hint"></span></h2>
    <label for="k-slot-backup_github_token">token</label>
    <input id="k-slot-backup_github_token" type="password" autocomplete="new-password" spellcheck="false">
    <button id="k-slot-backup_github_token-button" type="button">등록</button>
    <span id="k-slot-backup_github_token-msg" class="msg" aria-live="polite"></span>
  </div>

  <!-- 공급자 칸(네이버 뉴스 등)은 공급자 선언에서 만든 칸 목록을 읽어 그린다. -->
  <div id="k-providers"></div>

<script>
(function () {
  "use strict";
  var REMOTE_KEYS_PATH = "/api/remote/keys";
  var SETUP_SLOTS_PATH = "/api/setup/slots";
  // 바깥 키 칸: item 이름 → 칸 이름.
  var SLOT_FIELDS = { dart: "api_key", ecos: "api_key", fred: "api_key", backup_github_token: "token" };
  // 공급자 선언에서 만든 키 칸 목록(이름 · 칸 이름 · 등록 여부만 온다).
  var SETUP_PROVIDERS_PATH = "/api/setup/providers";
  // 공급자 이름 → 화면에 적는 말(모르는 공급자는 이름 그대로).
  var PROVIDER_LABELS = { naver_news: "네이버 뉴스 키 (뉴스 검색)" };
  var REASONS = {
    key_rejected: "키가 맞지 않습니다",
    unreachable: "확인할 곳에 닿지 못했습니다",
    invalid_input: "칸을 다시 확인하세요",
    body_too_large: "값이 너무 깁니다",
    save_failed: "저장하지 못했습니다"
  };

  function say(node, text) { node.textContent = String(text); }

  // 칸별 등록 여부만 보여 준다(값은 오지 않는다).
  function loadSlots() {
    fetch(SETUP_SLOTS_PATH, { credentials: "same-origin", cache: "no-store" })
      .then(function (reply) { return reply.ok ? reply.json() : null; })
      .then(function (view) {
        if (!view || !Array.isArray(view.slots)) { return; }
        view.slots.forEach(function (slot) {
          var node = slot && document.getElementById("k-slot-" + slot.name + "-reg");
          if (node) { say(node, slot.registered === true ? "(등록됨)" : "(등록 안 됨)"); }
        });
      })
      .catch(function () { /* 다음 등록 뒤 다시 읽는다 */ });
    loadProviders();
  }

  // 공급자 칸 하나(칸마다 비밀 입력 칸 · 등록 단추 · 알림 자리)를 만들고 기존 키 등록 길에 잇는다.
  function providerBlock(provider) {
    var name = String(provider.provider);
    var $block = document.createElement("div");
    $block.className = "item";
    $block.id = "k-provider-" + name;
    var $title = document.createElement("h2");
    say($title, (PROVIDER_LABELS[name] || name) + " ");
    var $reg = document.createElement("span");
    $reg.id = "k-provider-" + name + "-reg";
    $reg.className = "hint";
    $title.appendChild($reg);
    $block.appendChild($title);
    var fields = {};
    provider.fields.forEach(function (field) {
      var id = "k-provider-" + name + "-" + String(field);
      var $label = document.createElement("label");
      $label.htmlFor = id;
      say($label, String(field));
      var $input = document.createElement("input");
      $input.id = id;
      $input.type = "password";
      $input.autocomplete = "new-password";
      $input.setAttribute("spellcheck", "false");
      $block.appendChild($label);
      $block.appendChild($input);
      fields[String(field)] = id;
    });
    var $button = document.createElement("button");
    $button.id = "k-provider-" + name + "-button";
    $button.type = "button";
    say($button, "등록");
    var $message = document.createElement("span");
    $message.id = "k-provider-" + name + "-msg";
    $message.className = "msg";
    $message.setAttribute("aria-live", "polite");
    $block.appendChild($button);
    $block.appendChild($message);
    document.getElementById("k-providers").appendChild($block);
    wire($button.id, $message.id, name, fields);
  }

  // 공급자 칸 목록을 읽어 없는 칸은 그리고 등록 여부를 적는다(값은 오지 않는다).
  function loadProviders() {
    fetch(SETUP_PROVIDERS_PATH, { credentials: "same-origin", cache: "no-store" })
      .then(function (reply) { return reply.ok ? reply.json() : null; })
      .then(function (view) {
        if (!view || !Array.isArray(view.providers)) { return; }
        view.providers.forEach(function (provider) {
          if (!provider || typeof provider.provider !== "string" || !Array.isArray(provider.fields)) { return; }
          if (!document.getElementById("k-provider-" + provider.provider)) { providerBlock(provider); }
          var node = document.getElementById("k-provider-" + provider.provider + "-reg");
          say(node, provider.registered === true ? "(등록됨)" : "(등록 안 됨)");
        });
      })
      .catch(function () { /* 다음 등록 뒤 다시 읽는다 */ });
  }

  function wire(buttonId, messageId, item, fields) {
    var $button = document.getElementById(buttonId);
    var $message = document.getElementById(messageId);
    $button.addEventListener("click", function () {
      var values = {};
      var inputs = [];
      Object.keys(fields).forEach(function (name) {
        var input = document.getElementById(fields[name]);
        values[name] = input.value;
        inputs.push(input);
      });
      $button.disabled = true;
      fetch(REMOTE_KEYS_PATH, {
        method: "POST",
        credentials: "same-origin",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ item: item, fields: values })
      })
        .then(function (reply) {
          return reply.json().catch(function () { return null; }).then(function (data) {
            if (reply.ok && data && data.registered) {
              say($message, "등록했습니다");
              loadSlots();
            } else if (reply.status === 401) {
              say($message, "먼저 로그인하세요");
            } else {
              say($message, (data && REASONS[data.error]) || "등록하지 못했습니다");
            }
          });
        })
        .catch(function () { say($message, "서버에 닿지 못했습니다"); })
        .then(function () {
          inputs.forEach(function (input) { input.value = ""; });
          values = null;
          $button.disabled = false;
        });
    });
  }

  wire("k-broker", "k-broker-msg", "broker",
    { client_id: "k-client-id", client_secret: "k-client-secret" });
  wire("k-ai", "k-ai-msg", "ai_api_key", { api_key: "k-api-key" });
  Object.keys(SLOT_FIELDS).forEach(function (item) {
    var fields = {};
    fields[SLOT_FIELDS[item]] = "k-slot-" + item;
    wire("k-slot-" + item + "-button", "k-slot-" + item + "-msg", item, fields);
  });
  loadSlots();
})();
</script>
</body>
</html>
