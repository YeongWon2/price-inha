<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>가격인하</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #ffffff; --fg: #1b1f24; --dim: #667085; --line: #d9dee5;
    --ok: #1a7f47; --warn: #9a6200; --bad: #c0362c; --up: #c0362c; --down: #1f5fbf;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14171b; --fg: #e6e9ee; --dim: #98a2b3; --line: #2b313a;
      --ok: #4cc38a; --warn: #e0a84a; --bad: #f0776c; --up: #f0776c; --down: #6ea8ff;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 24px 16px; background: var(--bg); color: var(--fg);
    font: 15px/1.5 system-ui, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  }
  main { max-width: 720px; margin: 0 auto; }
  h1 { font-size: 20px; margin: 0 0 12px; }
  h2 { font-size: 15px; margin: 24px 0 8px; color: var(--dim); font-weight: 600; }
  #status { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 16px; padding: 0; list-style: none; }
  #status li { padding: 2px 10px; border: 1px solid var(--line); border-radius: 999px; font-size: 13px; }
  #status li[hidden] { display: none; }
  .ok { color: var(--ok); } .warn { color: var(--warn); } .bad { color: var(--bad); }
  .wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  th, td { padding: 8px 10px; border-bottom: 1px solid var(--line); text-align: left; white-space: nowrap; }
  th { font-size: 13px; color: var(--dim); font-weight: 600; }
  td.num, th.num { text-align: right; }
  td.up { color: var(--up); } td.down { color: var(--down); }
  tr.late td { color: var(--warn); }
  body.offline table { opacity: 0.55; }
  #empty, #events:empty + #no-events { color: var(--dim); }
  #events { margin: 0; padding: 0; list-style: none; font-size: 13px; }
  #events li { padding: 4px 0; border-bottom: 1px solid var(--line); overflow-wrap: anywhere; }
  #events:not(:empty) + #no-events { display: none; }
</style>
</head>
<body>
<main>
  <h1>가격인하</h1>
  <ul id="status" aria-live="polite">
    <li id="st-conn" class="warn">연결하는 중</li>
    <li id="st-feed" hidden></li>
    <li id="st-late" class="warn" hidden>시세 늦음</li>
  </ul>

  <div class="wrap">
    <table>
      <thead>
        <tr><th>종목</th><th class="num">현재가</th><th>통화</th><th>받은 시각</th></tr>
      </thead>
      <tbody id="quotes"></tbody>
    </table>
  </div>
  <p id="empty">아직 받은 시세가 없습니다.</p>

  <h2>최근 이벤트</h2>
  <ul id="events"></ul>
  <p id="no-events">아직 받은 이벤트가 없습니다.</p>
  <noscript>이 화면은 스크립트가 켜져 있어야 시세를 보여 줍니다.</noscript>
</main>

<script>
(function () {
  "use strict";

  var SESSION_PATH = "/api/session";
  var WS_PATH = "/ws";
  var RETRY_MIN_MS = 1000;
  var RETRY_MAX_MS = 10000;
  var MAX_EVENTS = 20;

  var $conn = document.getElementById("st-conn");
  var $feed = document.getElementById("st-feed");
  var $late = document.getElementById("st-late");
  var $quotes = document.getElementById("quotes");
  var $empty = document.getElementById("empty");
  var $events = document.getElementById("events");

  var lastSeq = null;      // 마지막으로 받은 이벤트 번호. 아직 없으면 null(지금부터 받는다).
  var retryMs = RETRY_MIN_MS;
  var rows = {};           // 종목 → { tr, price, currency, at, last }
  var lateSymbols = {};

  // 서버가 준 글자는 언제나 textContent로만 넣는다.
  function setText(node, text) { node.textContent = String(text); }

  function setConn(text, kind) {
    setText($conn, text);
    $conn.className = kind;
    document.body.classList.toggle("offline", kind !== "ok");
  }

  function timeText(millis) {
    if (typeof millis !== "number") { return "-"; }
    var d = new Date(millis);
    return isNaN(d.getTime()) ? "-" : d.toLocaleTimeString("ko-KR", { hour12: false });
  }

  function cell(tr, className) {
    var td = document.createElement("td");
    if (className) { td.className = className; }
    tr.appendChild(td);
    return td;
  }

  function rowFor(symbol) {
    if (rows[symbol]) { return rows[symbol]; }
    var tr = document.createElement("tr");
    var row = { tr: tr, last: null };
    setText(cell(tr), symbol);
    row.price = cell(tr, "num");
    row.currency = cell(tr);
    row.at = cell(tr);
    $quotes.appendChild(tr);
    rows[symbol] = row;
    return row;
  }

  function showQuotes(payload) {
    var list = payload && Array.isArray(payload.quotes) ? payload.quotes : [];
    list.forEach(function (quote) {
      if (!quote || typeof quote.symbol !== "string") { return; }
      var row = rowFor(quote.symbol);
      var price = Number(quote.price);
      var direction = "";
      if (row.last !== null && isFinite(price)) {
        direction = price > row.last ? " up" : price < row.last ? " down" : "";
      }
      if (isFinite(price)) { row.last = price; }
      row.price.className = "num" + direction;
      setText(row.price, quote.price);
      setText(row.currency, quote.currency || "");
      setText(row.at, timeText(quote.received_at));
    });
    $empty.hidden = Object.keys(rows).length > 0;
  }

  function showFeed(payload) {
    var state = payload ? payload.state : "";
    var text = "시세 상태를 알 수 없음";
    var kind = "warn";
    if (state === "no_broker_key") { text = "증권사 키가 없음 (시세를 받지 않습니다)"; kind = "bad"; }
    else if (state === "demo") { text = "시연 (가짜 시세)"; kind = "warn"; }
    else if (state === "live") { text = "증권사 시세"; kind = "ok"; }
    setText($feed, text);
    $feed.className = kind;
    $feed.hidden = false;
  }

  function showLate(payload) {
    var list = payload && Array.isArray(payload.symbols) ? payload.symbols : [];
    lateSymbols = {};
    list.forEach(function (symbol) { lateSymbols[String(symbol)] = true; });
    Object.keys(rows).forEach(function (symbol) {
      rows[symbol].tr.classList.toggle("late", lateSymbols[symbol] === true);
    });
    setText($late, list.length > 0 ? "시세 늦음 (" + list.length + "종목)" : "시세 늦음");
    $late.hidden = list.length === 0;
  }

  function showEvent(frame) {
    var li = document.createElement("li");
    setText(li, "#" + frame.seq + " · " + timeText(frame.at) + " · " + frame.kind);
    $events.insertBefore(li, $events.firstChild);
    while ($events.childNodes.length > MAX_EVENTS) { $events.removeChild($events.lastChild); }
  }

  function onFrame(text) {
    var frame;
    try { frame = JSON.parse(text); } catch (error) { return; }
    if (!frame || typeof frame.kind !== "string") { return; }
    if (typeof frame.seq === "number") {
      // 저장되는 이벤트: 이미 받은 번호는 다시 그리지 않는다.
      if (lastSeq !== null && frame.seq <= lastSeq) { return; }
      lastSeq = frame.seq;
      showEvent(frame);
      return;
    }
    // 지나가는 이벤트(번호 없음).
    if (frame.kind === "quotes") { showQuotes(frame.payload); }
    else if (frame.kind === "feed_status") { showFeed(frame.payload); }
    else if (frame.kind === "quotes_stale") { showLate(frame.payload); }
  }

  function retryLater() {
    var wait = retryMs;
    retryMs = Math.min(retryMs * 2, RETRY_MAX_MS);
    setTimeout(start, wait);
  }

  function openSocket() {
    var scheme = location.protocol === "https:" ? "wss://" : "ws://";
    var url = scheme + location.host + WS_PATH;
    // 끊겼다가 다시 이을 때는 마지막으로 받은 번호 뒤부터 받는다.
    if (lastSeq !== null) { url += "?last_seq=" + encodeURIComponent(String(lastSeq)); }
    var socket;
    try { socket = new WebSocket(url); } catch (error) { retryLater(); return; }
    var closed = false;
    function onClose() {
      if (closed) { return; }
      closed = true;
      setConn("연결 끊김 (마지막으로 받은 상태 유지) · 다시 잇는 중", "bad");
      retryLater();
    }
    socket.onopen = function () {
      retryMs = RETRY_MIN_MS;
      setConn("연결됨", "ok");
    };
    socket.onmessage = function (event) {
      if (typeof event.data === "string") { onFrame(event.data); }
    };
    socket.onclose = onClose;
    socket.onerror = function () { try { socket.close(); } catch (error) { /* 이미 닫힘 */ } onClose(); };
  }

  // 세션을 얻고(서버를 다시 켜면 세션이 사라지므로 이을 때마다 얻는다) 실시간 연결을 연다.
  function start() {
    fetch(SESSION_PATH, { method: "POST", credentials: "same-origin", cache: "no-store" })
      .then(function (reply) {
        if (!reply.ok) { throw new Error("session"); }
        openSocket();
      })
      .catch(function () {
        setConn("연결 끊김 (마지막으로 받은 상태 유지) · 다시 잇는 중", "bad");
        retryLater();
      });
  }

  start();
})();
</script>
</body>
</html>
