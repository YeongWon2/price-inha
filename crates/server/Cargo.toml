[package]
name = "price-inha"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
async-trait = "0.1.92"
axum = "0.8.9"
chrono = "0.4.45"
pi-ai = { version = "0.1.0", path = "../ai" }
pi-gate = { version = "0.1.0", path = "../gate" }
pi-market = { version = "0.1.0", path = "../market" }
pi-secrets = { version = "0.1.0", path = "../secrets" }
pi-store = { version = "0.1.0", path = "../store" }
rust_decimal = "1.43.0"
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "signal", "time", "sync"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "std", "ansi"] }

[dev-dependencies]
chrono = "0.4.45"
futures = "0.3.34"
reqwest = { version = "0.13.5", default-features = false }
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "time", "net", "io-util", "sync"] }
tokio-tungstenite = "0.30.0"
wiremock = "0.6.5"
