[package]
name = "pi-backup"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
age = "0.12.1"
base64 = "0.23.1"
hex = "0.4.3"
pi-secrets = { path = "../secrets" }
pi-store = { path = "../store" }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tempfile = "3.27.0"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt", "fs"] }

[dev-dependencies]
percent-encoding = "2.3.2"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros"] }
wiremock = "0.6.5"
