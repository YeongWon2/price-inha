[package]
name = "pi-knowledge"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
pi-store = { path = "../store" }
async-trait = "0.1.92"
rust_decimal = { version = "1.43.0", features = ["serde"] }
