<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1e293b">
  <title>가격인하</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon-192.png">
  <style>
    :root { color-scheme: light dark; --bg: #f8fafc; --fg: #0f172a; --card: #ffffff; --line: #e2e8f0; --accent: #1e293b; --ok: #15803d; --no: #b91c1c; }
    @media (prefers-color-scheme: dark) { :root { --bg: #0f172a; --fg: #e2e8f0; --card: #1e293b; --line: #334155; --accent: #f5c518; } }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 16px; font-family: system-ui, sans-serif; background: var(--bg); color: var(--fg); }
    header { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 16px; }
    h1 { font-size: 1.2rem; margin: 0; }
    h2 { font-size: 1rem; margin: 0 0 8px; }
    section { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px; margin-bottom: 12px; }
    button { font: inherit; padding: 10px 14px; border-radius: 8px; border: 1px solid var(--line); background: var(--card); color: var(--fg); }
    button[data-action="approve"] { background: var(--ok); color: #fff; border-color: var(--ok); }
    button[data-action="reject"] { background: var(--no); color: #fff; border-color: var(--no); }
    input[data-field="code"] { font: inherit; font-size: 1.4rem; letter-spacing: 0.3em; width: 8em; padding: 8px; text-align: center; }
    .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: 8px; }
    .muted { opacity: 0.7; font-size: 0.9rem; }
    ul { list-style: none; margin: 0; padding: 0; }
    li { padding: 8px 0; border-bottom: 1px solid var(--line); }
    li:last-child { border-bottom: 0; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <header>
    <h1>가격인하</h1>
    <button type="button" data-action="open-office">3D 사무실</button>
  </header>

  <section id="push-setup">
    <h2>폰 알림</h2>
    <p class="muted" data-part="push-status">알림을 켜면 승인 요청과 이상을 바로 받아요.</p>
    <button type="button" data-action="enable-push">알림 켜기</button>
  </section>

  <section id="approval" data-card="approval" data-approval-id="" data-fingerprint="" hidden>
    <h2>승인이 필요해요</h2>
    <p data-part="summary"></p>
    <p class="muted">내용 지문 <span data-part="fingerprint"></span></p>
    <label class="row">6자리 확인 코드(서버 화면의 코드와 같은지 보세요)
      <input type="text" data-field="code" inputmode="numeric" maxlength="6" readonly tabindex="-1">
    </label>
    <div class="row">
      <button type="button" data-action="approve">승인</button>
      <button type="button" data-action="reject">거절</button>
    </div>
    <p class="muted" data-part="result" role="status"></p>
  </section>

  <section id="daily-summary">
    <h2>하루 정리</h2>
    <div data-part="done"><h3>한 일</h3><p class="muted">아직 없어요.</p></div>
    <div data-part="pnl"><h3>손익</h3><p class="muted">아직 없어요.</p></div>
    <div data-part="review"><h3>복기</h3><p class="muted">아직 없어요.</p></div>
  </section>

  <section>
    <h2>알림</h2>
    <ul id="notice-list"></ul>
  </section>

  <script src="app.js"></script>
</body>
</html>
