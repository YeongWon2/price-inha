[package]
name = "pi-notify"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# 시험 전용: HttpTransport::redirect_to를 연다. 기본은 꺼짐.
test-redirect = []

[dependencies]
thiserror.workspace = true
pi-store.workspace = true
p256.workspace = true
aes-gcm.workspace = true
hkdf.workspace = true
base64.workspace = true
rand.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt", "time", "macros", "net", "sync", "io-util"] }
reqwest = { workspace = true, features = ["rustls"] }
async-trait.workspace = true
url.workspace = true
sha2.workspace = true

[dev-dependencies]
tempfile.workspace = true
pi-notify = { workspace = true, features = ["test-redirect"] }
