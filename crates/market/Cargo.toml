[package]
name = "pi-market"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
async-trait = "0.1.92"
chrono = { version = "0.4.45", default-features = false, features = ["std", "clock", "serde"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json", "form"] }
rust_decimal = "1.43.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt", "sync", "time", "macros"] }

[dev-dependencies]
futures = "0.3.34"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "test-util", "time", "sync"] }
url = "2.5.8"
wiremock = "0.6.5"
