# 아키텍처 · 컨벤션 규칙. scripts/check_arch.py가 읽어 기계로 검사한다.
# 규칙을 바꾸려면 이 파일을 고친다(사용자 확인 뒤). 검사 스크립트는 고치지 않는다.

[limits]
max_src_lines = 500          # src 파일 하나의 최대 줄 수 (tests 제외)
max_fn_lines = 80            # 함수 하나의 최대 줄 수 (tests 제외)

# 크레이트마다: 맡은 구성 요소, 써도 되는 내부 모듈, 써도 되는 바깥 의존(실행 코드 기준)
[crates.pi-store]
dir = "crates/store"
component = "A12 저장소"
internal = []
external = ["rusqlite", "serde", "serde_json", "thiserror", "time", "rust_decimal", "tracing"]

[crates.pi-secrets]
dir = "crates/secrets"
component = "A13 비밀 보관"
internal = []
external = ["serde", "serde_json", "thiserror", "zeroize", "base64", "percent-encoding", "async-trait", "tempfile", "tracing", "dirs", "subtle"]

[crates.pi-ai]
dir = "crates/ai"
component = "A11 AI 공급자 어댑터"
internal = ["pi-secrets"]
external = ["reqwest", "serde", "serde_json", "thiserror", "tokio", "async-trait", "zeroize", "tracing", "url"]

[crates.pi-market]
dir = "crates/market"
component = "A9 시장 어댑터"
internal = ["pi-secrets"]
external = ["reqwest", "serde", "serde_json", "thiserror", "tokio", "async-trait", "zeroize", "tracing", "url", "rust_decimal", "chrono", "futures", "tokio-stream"]

[crates.pi-paper]
dir = "crates/paper"
component = "A8 주문 실행기 (모의계좌와 체결)"
internal = ["pi-market"]
external = ["serde", "serde_json", "thiserror", "rust_decimal", "chrono", "async-trait", "tokio", "tracing"]

[crates.pi-gate]
dir = "crates/gate"
component = "A2 접속 관문"
internal = ["pi-store"]
external = ["axum", "tokio", "tower", "tower-http", "serde", "serde_json", "thiserror", "tracing", "rand", "sha2", "hex", "base64", "chrono", "futures", "tokio-stream", "http", "subtle"]

[crates.pi-template]
dir = "crates/template"
component = "A6 템플릿 · 절대 상한 · 승격 기준(M3)"
internal = []
external = ["serde", "serde_json", "thiserror", "rust_decimal"]

[crates.pi-data]
dir = "crates/data"
component = "A10 자료 어댑터 (공시 · 재무 · 거시)"
internal = ["pi-secrets"]
external = ["reqwest", "serde", "serde_json", "thiserror", "tokio", "async-trait", "zeroize", "tracing", "url", "rust_decimal", "chrono"]

[crates.pi-trigger]
dir = "crates/trigger"
component = "A5 깨우기 (일정 · 시세 조건)"
internal = ["pi-market"]
external = ["serde", "serde_json", "thiserror", "tokio", "async-trait", "tracing", "rust_decimal", "chrono", "futures"]

[crates.pi-rules]
dir = "crates/rules"
component = "A6 규칙 엔진"
internal = ["pi-template", "pi-paper", "pi-market"]
external = ["serde", "serde_json", "thiserror", "rust_decimal", "chrono", "tracing"]

[crates.pi-approval]
dir = "crates/approval"
component = "A7 승인 관리"
internal = ["pi-store"]
external = ["serde", "serde_json", "thiserror", "rust_decimal", "chrono", "tracing", "sha2", "hex", "rand"]

[crates.pi-office]
dir = "crates/office"
component = "A3 사무실 서버 + A1 3D 사무실 화면"
internal = ["pi-store"]
external = ["serde", "serde_json", "thiserror", "chrono", "tracing", "async-trait", "tokio"]

[crates.pi-exec]
dir = "crates/exec"
component = "A8 주문 실행기 (모의계좌 바깥: 승인된 주문을 규칙 · 승인 확인 뒤 모의계좌로)"
internal = ["pi-paper", "pi-market", "pi-store", "pi-rules", "pi-approval"]
external = ["serde", "serde_json", "thiserror", "rust_decimal", "chrono", "async-trait", "tokio", "tracing"]

[crates.pi-journal]
dir = "crates/journal"
component = "A4 복기 · M4 · 하루 정리"
internal = ["pi-store", "pi-template"]
external = ["serde", "serde_json", "thiserror", "rust_decimal", "chrono", "tracing", "sha2", "hex"]

[crates.pi-agent]
dir = "crates/agent"
component = "A4 에이전트 실행"
internal = ["pi-ai", "pi-store"]
external = ["serde", "serde_json", "thiserror", "tokio", "async-trait", "tracing", "chrono", "rust_decimal", "futures", "sha2", "hex"]

[crates.pi-notify]
dir = "crates/notify"
component = "A3 알림 · A1 폰 (웹 푸시)"
internal = ["pi-store"]
external = ["serde", "serde_json", "thiserror", "tokio", "async-trait", "tracing", "chrono", "reqwest", "url", "p256", "aes-gcm", "hkdf", "sha2", "base64", "rand", "zeroize"]

[crates.pi-knowledge]
dir = "crates/knowledge"
component = "M7 지식 (키워드 · 조건 검색, 뜻 검색 자리)"
internal = ["pi-store"]
external = ["serde", "serde_json", "thiserror", "async-trait", "rust_decimal", "tokio", "tracing", "chrono"]

[crates.pi-backup]
dir = "crates/backup"
component = "D7 백업과 되살리기 (age 암호화 · private GitHub contents API)"
internal = ["pi-store", "pi-secrets"]
external = ["age", "base64", "hex", "reqwest", "serde", "serde_json", "sha2", "tempfile", "thiserror", "tokio", "tracing", "chrono", "zeroize"]

[crates.price-inha]
dir = "crates/server"
component = "실행 파일, 조립"
internal = ["pi-store", "pi-secrets", "pi-ai", "pi-market", "pi-paper", "pi-gate", "pi-template", "pi-data", "pi-trigger", "pi-rules", "pi-approval", "pi-office", "pi-exec", "pi-journal", "pi-agent", "pi-notify", "pi-knowledge", "pi-backup"]
external = ["*"]

# 어디에도 들어오면 안 되는 의존 (전체 의존 나무 기준)
[[banned_deps]]
name = "openssl-sys"
why = "모든 운영체제에서 같은 빌드가 되어야 한다(D1)"
fix = "reqwest는 default-features = false 와 rustls 기능으로 쓴다"

[[banned_deps]]
name = "native-tls"
why = "모든 운영체제에서 같은 빌드가 되어야 한다(D1)"
fix = "reqwest는 default-features = false 와 rustls 기능으로 쓴다"

# 의존의 판은 루트 Cargo.toml [workspace.dependencies] 한 곳에서 정한다(QMIT 결정 5, decisions.md 2026-11-24).
# 크레이트 Cargo.toml 의 의존에 판(문자열이나 version =)을 직접 적으면 ARCH-DEP-WORKSPACE 로 잡는다.
# 기능(features)은 크레이트 쪽에 `{ workspace = true, features = [...] }` 로 더할 수 있다.
[dep_workspace]
why = "판이 크레이트마다 흩어지면 같은 의존이 두 판으로 갈린다(QMIT 결정 5: 판 중앙 고정)"
fix = "루트 Cargo.toml [workspace.dependencies] 에 {dep} 의 판을 두고 크레이트에는 `{dep} = { workspace = true }`(기능은 features = [...])로 적는다. 루트에 다른 판이 있으면 고르지 말고 멈추고 사람에게 묻는다"
# 크레이트끼리 판이 갈려 사람에게 묻는 중인 의존. 정해지면 루트로 옮기고 여기서 뺀다.
# (2026-11-24 결정 9: base64 0.23 · rand 0.9 로 맞춰 루트로 옮김)
pending = []
# 새 바깥 의존은 사용자 승인으로만 들어온다(QMIT 결정 8). 루트 [workspace.dependencies]의 바깥 이름은
# 크레이트별 external 의 합(price-inha 의 "*" 는 빼고)이나 아래 목록 안이어야 한다. 밖이면 ARCH-DEP-NEW.
# 아래는 라이브러리 external 에 없는 것: 테스트용(dev) 의존과 실행 파일(price-inha)만 쓰는 의존.
extra = ["proptest", "static_assertions", "tokio-tungstenite", "tracing-subscriber", "wiremock"]
new_why = "새 바깥 의존은 공급망 위험이라 사용자 승인으로만 더한다(QMIT 결정 8)"
new_fix = "{dep} 를 더하지 말고 멈춰 조정자에게 알린다. 조정자가 사용자 승인을 받아 architecture.toml(그 크레이트의 external, 테스트 · 실행 파일 전용이면 [dep_workspace] extra)에 더한다"

# 화면(npm) 의존 이름의 허용 목록(QMIT 결정 8). crates/*/web/package.json 의 dependencies · devDependencies
# 이름이 여기 밖이면 ARCH-WEB-DEP. 더하는 것은 ARCH-DEP-NEW 와 같이 사용자 승인으로만.
[web]
allowed = ["three", "jsdom", "typescript", "vite", "vitest"]

# 공급망 발행일 검사(scripts/supply.py): 기준 판에 없던 새 판은 이 날수가 지나야 들인다(QMIT 결정 8).
[supply]
min_age_days = 14
# 보안 수정 판 예외(결정 9): 보안 권고를 고친 판은 14일 안이어도 들인다. 사람이 결정한 것만 적는다.
# 14일이 지나면 그 줄은 지워도 된다(기준 판에 들어간 뒤에는 검사하지 않는다).
security_fixes = [
  { crate = "url", version = "2.5.9", advisory = "RUSTSEC-2026-0592", reason = "url 2.5.8 의 보안 권고를 고친 판(결정 9, 사용자 결정 2026-11-24)" },
  { crate = "form_urlencoded", version = "1.2.3", advisory = "RUSTSEC-2026-0592", reason = "url 2.5.9 가 요구하는 짝 판(같은 릴리스, 결정 9 — 조정자, 사용자 '알아서 추천대로')" },
]

# 코드에 있으면 안 되는 모양. scope: 검사할 폴더(glob), except: 빼는 폴더.
[[patterns]]
id = "ARCH-MONEY-FLOAT"
regex = '\b(f32|f64)\b'
scope = ["crates/store/src", "crates/market/src", "crates/paper/src", "crates/template/src", "crates/data/src", "crates/trigger/src", "crates/rules/src", "crates/approval/src", "crates/exec/src", "crates/journal/src"]
why = "돈과 가격을 부동소수점으로 다루면 값이 어긋난다"
fix = "rust_decimal::Decimal 이나 정수 최소 단위를 쓴다"

[[patterns]]
id = "ARCH-ORDER-API"
regex = '/api/v1/(orders|conditional-orders|buying-power|sellable-quantity|holdings|accounts|transactions)'
scope = ["crates"]
why = "토스증권에는 모의투자가 없어 주문 · 계좌 API는 실제 돈을 움직인다. 이번 범위가 아니다"
fix = "그 호출을 지운다. 주문은 T7에서 자체 모의계좌로 만든다"

[[patterns]]
id = "ARCH-SECRET-FILES"
regex = '"(\.env|auth\.json)"'
scope = ["crates"]
except = ["crates/secrets"]
why = "키 파일은 pi-secrets만 읽고 쓴다(A13)"
fix = "pi-secrets의 공개 API나 CredentialSource trait을 거친다"

[[patterns]]
id = "ARCH-ENV-READ"
regex = '\benv::(var|vars|var_os)\b'
scope = ["crates/store/src", "crates/ai/src", "crates/market/src", "crates/paper/src", "crates/gate/src", "crates/template/src", "crates/data/src", "crates/trigger/src", "crates/rules/src", "crates/approval/src", "crates/office/src", "crates/exec/src", "crates/journal/src", "crates/agent/src", "crates/notify/src"]
why = "환경 변수는 조립하는 곳(price-inha)과 pi-secrets만 읽는다. 라이브러리는 인자로 받는다"
fix = "설정 값을 생성자 인자로 받게 바꾼다"

[[patterns]]
id = "ARCH-CLOCK"
regex = '\b(SystemTime|Instant|OffsetDateTime|Utc|Local)::now\b|now_utc\(\)'
scope = ["crates/store/src"]
why = "저장소는 시각을 인자로 받는다(테스트가 시계를 정한다)"
fix = "시각을 호출하는 쪽에서 넘긴다"

[[patterns]]
id = "ARCH-PAPER-PURE"
regex = '\b(reqwest|TcpStream|UdpSocket|hyper|rusqlite|std::fs|tokio::fs)\b|\b(SystemTime|Instant|Utc|Local)::now\b'
scope = ["crates/paper/src"]
why = "모의계좌는 바깥으로 나가지 않고 파일 · DB · 시계를 직접 쓰지 않는다. 실제 주문이 나갈 길이 없어야 하고, 같은 입력은 같은 결과여야 한다"
fix = "시세 · 시각은 인자로 받고, 저장은 상태를 값으로 내보내 조립하는 쪽에 맡긴다"

[[patterns]]
id = "ARCH-NET-IN-STORE"
regex = '\b(reqwest|TcpStream|UdpSocket|hyper)\b'
scope = ["crates/store/src", "crates/secrets/src"]
why = "저장소와 비밀 보관은 바깥으로 나가지 않는다(V23, N8)"
fix = "바깥 호출은 어댑터 모듈(pi-ai, pi-market)에 둔다"

[[patterns]]
id = "CONV-BOX-ERROR"
regex = 'Box<dyn (std::error::)?Error'
scope = ["crates/store/src", "crates/secrets/src", "crates/ai/src", "crates/market/src", "crates/gate/src", "crates/template/src", "crates/data/src", "crates/trigger/src", "crates/rules/src", "crates/approval/src", "crates/office/src", "crates/exec/src", "crates/journal/src", "crates/agent/src", "crates/notify/src"]
why = "라이브러리는 종류가 구분되는 오류 타입을 낸다"
fix = "thiserror로 만든 그 모듈의 오류 enum을 쓴다"

[[patterns]]
id = "ARCH-RULES-PURE"
regex = '\b(reqwest|TcpStream|UdpSocket|hyper|rusqlite|std::fs|tokio::fs)\b|\b(SystemTime|Instant|OffsetDateTime|Utc|Local)::now\b|now_utc\(\)'
scope = ["crates/template/src", "crates/rules/src", "crates/journal/src"]
why = "템플릿 · 상한 계산과 규칙 점검은 순수 계산이다. 네트워크 · 파일 · DB · 시계를 직접 쓰지 않아야 같은 입력이 같은 결과를 낸다"
fix = "값과 시각은 인자로 받고, 저장은 값을 내보내 store에 맡긴다"

[[patterns]]
id = "ARCH-CLOCK-2"
regex = '\b(SystemTime|Instant|OffsetDateTime|Utc|Local)::now\b|now_utc\(\)'
scope = ["crates/data/src", "crates/trigger/src", "crates/approval/src", "crates/office/src", "crates/exec/src", "crates/journal/src", "crates/agent/src", "crates/notify/src"]
why = "자료의 알게 된 시각, 깨우기 일정, 승인 만료, 사무실 이벤트 시각은 주입한 Clock으로 낸다(테스트가 시계를 정한다)"
fix = "Clock trait을 인자로 받아 그 값을 쓴다. 실제 시계는 조립하는 곳(price-inha)이 넣는다"

[[patterns]]
id = "ARCH-NET-IN-CORE"
regex = '\b(reqwest|TcpStream|UdpSocket|hyper)\b'
scope = ["crates/trigger/src", "crates/approval/src", "crates/office/src", "crates/exec/src", "crates/journal/src", "crates/agent/src"]
why = "깨우기 · 승인 · 사무실은 바깥으로 직접 나가지 않는다. 시세 · 달력은 pi-market을 거치고, 웹 입구는 pi-gate가 맡는다"
fix = "바깥 호출은 어댑터 모듈(pi-market, pi-data)에 두고 trait(포트)으로 받는다"

[[patterns]]
id = "ARCH-REAL-BROKER"
regex = '\bimpl\b[^{;]*\bBroker\s+for\b'
scope = ["crates"]
except = ["crates/paper"]
why = "주문을 받는 증권사(Broker) 구현은 자체 모의계좌(pi-paper)뿐이다. 다른 곳에 구현이 생기면 실제 증권사로 주문이 나갈 길이 열린다"
fix = "pi-paper의 모의계좌(PaperBroker)를 쓴다. 실제 증권사 주문 코드는 만들지 않는다"

[[patterns]]
id = "CONV-SECRET-LOG"
regex = '(tracing::)?(trace|debug|info|warn|error)!\([^)]*\b(expose|client_secret|access_token|api_key)\b'
scope = ["crates"]
except_tests = true
why = "비밀 값이 기록으로 나갈 수 있다(E38)"
fix = "비밀 값을 기록에 넣지 않는다. 필요하면 등록 여부만 남긴다"

[[patterns]]
id = "CONV-BIND-ALL"
regex = '0\.0\.0\.0|\[::\]'
scope = ["crates"]
except_tests = true
why = "기본은 그 컴퓨터에서만 연다(D2)"
fix = "기본 주소는 127.0.0.1로 두고, 다른 주소는 사용자가 설정으로 준 값만 쓴다"

# 구조 규칙
[structure]
lib_crates_have_no_main = true     # 실행 파일은 price-inha 하나
lib_crates_have_error_rs = true    # 라이브러리마다 src/error.rs에 오류 타입
tests_only_in_tests_dir = false    # src 안의 단위 테스트는 허용
