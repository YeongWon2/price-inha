# 구현 그래프. scripts/pipeline.py가 읽어 "지금 무엇을 할 수 있는가"를 정한다.
# 사람이 읽는 설명은 docs/dev/pipeline.md.

max_same_failure = 3   # 같은 실패가 이만큼 되풀이되면 멈추고 사람에게 넘긴다
escalate_model_at = 2  # 같은 실패가 이만큼이면 그 노드를 한 등급 위 모델로 다시 맡긴다 (QMIT 결정 3)
max_review_rounds = 2  # AI 검토에서 되돌아가는 횟수 한도

# 그래프 밖의 일(원본 조사)이 쓰는 곳. 노드의 범위 검사에서 빼지만, 노드는 여기를 고치지 않는다(프롬프트 규칙).
outside_graph = ["docs/research/**"]

# 모듈과 순서. needs의 모듈이 green 이상이어야 시작할 수 있다. needs가 같은 모듈끼리는 병렬이다.
[modules.store]
needs = []
[modules.secrets]
needs = []
[modules.ai]
needs = []
[modules.market]
needs = []
[modules.paper]
needs = ["market"]
[modules.gate]
needs = ["store", "secrets", "ai", "market"]
[modules.server]
needs = ["gate", "paper", "template", "rules", "approval", "exec", "data", "trigger", "agent", "journal", "knowledge", "backup", "office", "notify", "channel"]
# 2026-11-16 로드맵 T6~T22(decisions.md 2026-11-16 절, 옛 roadmap.md 는 다 만들어 지움 — git 기록). 크레이트는 그 모듈의 첫 N1 커밋에서 만든다.
# 기존 모듈의 새 차수(store 9~11, secrets 6, ai 7, gate 9)는 그래프 노드가 아니라 조정자가 차수 순서로 연다.
[modules.template]
needs = []
[modules.data]
needs = ["secrets"]
[modules.trigger]
needs = ["market"]
[modules.rules]
needs = ["template", "paper", "market"]
[modules.approval]
needs = ["store"]
[modules.office]
needs = ["store"]
[modules.exec]
needs = ["paper", "store", "rules", "approval"]
[modules.journal]
needs = ["store", "template"]
[modules.agent]
needs = ["ai", "store"]
[modules.notify]
needs = ["store"]
# 결정 24(2026-11-26): 메신저 채널. server 39차부터 server가 잇는다.
[modules.channel]
needs = []
[modules.knowledge]
needs = ["store"]
[modules.backup]
needs = ["store", "secrets"]

# 노드. writes: 그 노드가 고칠 수 있는 곳({dir}은 모듈 폴더마다, {module}은 모듈 이름으로 펼쳐진다). gate: 끝났다고 인정하는 검사.
# R(대조)은 reopen 한 모듈만 N1 앞에 돈다(처음 짓는 모듈은 R 없이 N1). QMIT 결정 1.
[nodes.R]
name = "대조 (reconcile)"
prompt = "docs/dev/prompts/r-reconcile.md"
writes = ["docs/dev/modules/{module}.md"]
gate = "GR"

[nodes.N1]
name = "테스트 작성 (red)"
prompt = "docs/dev/prompts/n1-test.md"
writes = ["{dir}/**", "Cargo.lock"]
gate = "G1"

[nodes.N2]
name = "구현 (green)"
prompt = "docs/dev/prompts/n2-impl.md"
writes = ["{dir}/src/**", "{dir}/web/**", "{dir}/build.rs", "{dir}/Cargo.toml", "Cargo.lock"]
gate = "G2"

[nodes.N3]
name = "AI 검토"
prompt = "docs/dev/prompts/n3-review.md"
writes = []
gate = "판정"
