# 간헐 실패 찾기: 고른 패키지의 테스트를 여러 번 돌려 실패한 판의 실패 줄만 모은다(손으로만 시작).
# 예: gh workflow run stress.yml -f package=pi-ai -f runs=40 -f os=ubuntu-latest
#     gh workflow run stress.yml -f package=price-inha -f args='--test round11' -f os=macos-latest
name: stress

on:
  workflow_dispatch:
    inputs:
      package:
        description: "cargo -p 이름(비우면 전체)"
        default: ""
      args:
        description: "cargo test 에 더할 인자(예: --test round11)"
        default: ""
      runs:
        description: "몇 번 돌릴까"
        default: "20"
      os:
        description: "운영체제"
        default: ubuntu-latest
        type: choice
        options: [ubuntu-latest, macos-latest]

permissions:
  contents: read

jobs:
  stress:
    runs-on: ${{ inputs.os }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: 여러 번 돌리기
        env:
          PKG: ${{ inputs.package }}
          RUNS: ${{ inputs.runs }}
          ARGS: ${{ inputs.args }}
        run: |
          if [ -n "$PKG" ]; then sel="-p $PKG"; else sel="--workspace"; fi
          sel="$sel $ARGS"
          cargo test $sel --no-run -q
          fails=0
          for i in $(seq 1 "$RUNS"); do
            if ! cargo test $sel -q > out.txt 2>&1; then
              fails=$((fails+1)); echo "== $i번째 실패"; grep -E 'FAILED|panicked|left:|right:' out.txt | head -12
            fi
          done
          echo "실패: $fails / $RUNS"
          [ "$fails" -eq 0 ]
