# 밤 CI: 게이트 자체를 재는 측정 둘. 보고만 하고 판정(성공 · 실패)에는 넣지 않는다.
# QMIT 결정 7: 환경에 따라 흔들리는 측정은 판정에서 뺀다. docs/dev/pipeline.md 10장.
# - mutants: cargo-mutants 로 돈 · 안전 핵심 크레이트의 시험이 일부러 넣은 버그를 잡는지 본다.
# - coverage: cargo-llvm-cov 로 워크스페이스 줄 커버리지를 크레이트별로 본다.
# 도구 판은 발행 14일 넘은 것만 고정한다(QMIT 결정 8 · 9, scripts/supply.py 와 같은 기준).
#   cargo-mutants 27.1.0 (2026-06-02) · cargo-llvm-cov 0.9.1 (2026-09-06, 0.9.2는 발행 14일 안이라 쓰지 않는다)
# 실제 증권사 · AI 서버를 부르지 않는다(테스트는 로컬 가짜 서버만 쓴다). 비밀값을 쓰지 않는다.
name: nightly

on:
  schedule:
    - cron: "0 19 * * *" # 매일 04:00 KST (audit 02:00 · verify 03:00 과 겹치지 않게)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  mutants:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    continue-on-error: true # 보고만 — 실패해도 판정에 넣지 않는다
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-mutants@27.1.0
      - name: 변이 시험 (pi-rules · pi-paper · pi-exec · pi-gate 전체)
        continue-on-error: true
        # 변이 하나의 시험 한도 180초. 전체 한도는 job timeout-minutes(150분)가 맡는다.
        run: >
          cargo mutants --no-shuffle --timeout 180 --build-timeout 600 --output mutants-report
          -p pi-rules -p pi-paper -p pi-exec -p pi-gate
      - name: 요약 (job summary)
        if: always()
        run: |
          python3 - <<'PY'
          import json, os, pathlib
          out = pathlib.Path("mutants-report/mutants.out")
          lines = ["## 변이 시험 (보고만, 판정 아님)", ""]
          oj = out / "outcomes.json"
          if oj.exists():
              d = json.loads(oj.read_text())
              lines += [
                  "| 전체 | 잡음(caught) | 놓침(missed) | 시간 초과 | 빌드 불가 |",
                  "|---|---|---|---|---|",
                  f"| {d.get('total_mutants')} | {d.get('caught')} | {d.get('missed')} | {d.get('timeout')} | {d.get('unviable')} |",
                  "",
              ]
          else:
              lines += ["결과 파일이 없다(빌드 실패 또는 시간 초과로 끝남).", ""]
          mt = out / "missed.txt"
          missed = mt.read_text().strip() if mt.exists() else ""
          lines += ["### 놓친 변이 목록", ""]
          lines += ["```", missed, "```"] if missed else ["없음 (또는 측정 못 함)."]
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as f:
              f.write("\n".join(lines) + "\n")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mutants-report
          path: mutants-report/
          if-no-files-found: ignore
          retention-days: 30

  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    continue-on-error: true # 보고만 — 실패해도 판정에 넣지 않는다
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov@0.9.1
      - name: 커버리지 (워크스페이스 전체)
        run: |
          mkdir -p coverage-report
          cargo llvm-cov --workspace --json --summary-only --output-path coverage-report/summary.json
      - name: 요약 (job summary)
        if: always()
        run: |
          python3 - <<'PY'
          import json, os, pathlib, re, collections
          lines = ["## 줄 커버리지 (보고만, 판정 아님)", ""]
          p = pathlib.Path("coverage-report/summary.json")
          if not p.exists():
              lines.append("결과 파일이 없다(빌드 또는 시험 실패로 끝남).")
          else:
              d = json.loads(p.read_text())["data"][0]
              per = collections.defaultdict(lambda: [0, 0])
              for f in d["files"]:
                  m = re.search(r"/crates/([^/]+)/", f["filename"])
                  key = m.group(1) if m else "(그 밖)"
                  per[key][0] += f["summary"]["lines"]["covered"]
                  per[key][1] += f["summary"]["lines"]["count"]
              lines += ["| 크레이트 | 덮은 줄 | 전체 줄 | 줄 커버리지 |", "|---|---|---|---|"]
              for k in sorted(per):
                  c, n = per[k]
                  lines.append(f"| {k} | {c} | {n} | {(100 * c / n) if n else 0:.1f}% |")
              t = d["totals"]["lines"]
              lines.append(f"| **전체** | {t['covered']} | {t['count']} | **{t['percent']:.1f}%** |")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as f:
              f.write("\n".join(lines) + "\n")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage-report/
          if-no-files-found: ignore
          retention-days: 30
