# 공급망 검사(네트워크가 필요한 것). 매일 밤 · 의존이 바뀔 때 돈다. docs/dev/pipeline.md 5장, QMIT 결정 8.
# - 보안 공지(RustSec): cargo audit(.cargo/audit.toml) · cargo deny check advisories(deny.toml)
# - 새 판 발행일: scripts/supply.py — PR · push 는 기준에 없던 새 판만(14일 안이면 실패), 밤은 --all 로 보고만.
# 라이선스 · 금지 크레이트 · 출처는 오프라인이라 verify.sh 10번 검사가 본다.
name: audit

on:
  schedule:
    - cron: "0 17 * * *" # 매일 02:00 KST
  push:
    branches: [main]
    paths: [Cargo.lock, Cargo.toml, "crates/*/Cargo.toml", deny.toml, ".cargo/audit.toml",
            "crates/*/web/package.json", "crates/*/web/package-lock.json"]
  pull_request:
    paths: [Cargo.lock, Cargo.toml, "crates/*/Cargo.toml", deny.toml, ".cargo/audit.toml",
            "crates/*/web/package.json", "crates/*/web/package-lock.json"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # supply.py 가 기준 판의 lock 파일과 비교한다
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit,cargo-deny@0.20.2 # scripts/lib.sh DENY_VERSION 과 같게
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: cargo audit
        run: cargo audit
      - name: cargo deny check advisories
        run: cargo deny check advisories
      - name: 새 판 발행일 (PR — 대상 브랜치에 없던 판)
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: python scripts/supply.py --since "origin/$BASE_REF"
      - name: 새 판 발행일 (push — 앞 커밋에 없던 판)
        if: github.event_name == 'push'
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          if git rev-parse -q --verify "$BEFORE^{commit}" >/dev/null; then
            python scripts/supply.py --since "$BEFORE"
          else
            python scripts/supply.py --since HEAD~1
          fi
      - name: 발행일 보고 (밤 · 손으로 — 모든 판, 보고만)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: python scripts/supply.py --all
