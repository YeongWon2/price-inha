# 끝났다는 기준(scripts/verify.sh)을 push · PR마다 기계로 다시 돌린다.
# QMIT 결정 6: PR은 영향 범위만(--affected), main push · 밤 · 손으로 돌릴 때는 전체.
# 검사기 자체 시험(selftest.py)을 먼저 통과시켜야 verify.sh 0번 검사가 통과한다.
# 실제 증권사 · AI 서버를 부르지 않는다(테스트는 로컬 가짜 서버만 쓴다). 비밀값을 쓰지 않는다.
name: verify

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 18 * * *" # 매일 03:00 KST 전체
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    # D1: 집 PC · 미니 PC의 모든 운영체제에서 돌아야 한다. Linux와 macOS에서 같이 돌린다.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # red/<모듈> 태그로 잠긴 테스트를 대조한다(4번 검사)
      - name: red 태그 받기
        run: git fetch --force --tags origin
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      # 결정 1: 화면은 Vite(crates/server/web). verify.sh 3w 검사가 npm ci · tsc · vitest · 빌드 대조를 돈다.
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      - name: 시험용 git 이름(검사기 자체 시험이 가짜 저장소에 커밋한다)
        run: |
          git config --global user.name "ci"
          git config --global user.email "ci@localhost"
      - name: 검사기 자체 시험
        run: python scripts/selftest.py
      - name: verify.sh (PR — 영향 범위)
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: bash scripts/verify.sh --affected --base "origin/$BASE_REF"
      - name: verify.sh (전체)
        if: github.event_name != 'pull_request'
        run: bash scripts/verify.sh
