# 의존성 새 버전을 매주 묶어서 PR로 올린다. 합치기 전에 verify 워크플로가 통과해야 한다.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # 큰 버전 올림은 API가 바뀌어 모듈 파이프라인(테스트 → 구현)으로 따로 한다.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      cargo:
        patterns: ["*"]
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
