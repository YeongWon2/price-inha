[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "MIT"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unused_must_use = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
wildcard_imports = "deny"
await_holding_lock = "deny"
large_futures = "warn"

# 바깥 · 내부 의존의 판은 여기 한 곳에서 정한다(QMIT 결정 5). 크레이트는 `workspace = true`로 받는다.
# 기능(features)은 모든 크레이트가 같을 때만 여기 두고, 다르면 크레이트 쪽에 둔다.
[workspace.dependencies]
aes-gcm = "0.11.1"
age = "0.12.1"
async-trait = "0.1.92"
axum = "0.8.9"
base64 = "0.23.1"
chrono = { version = "0.4.45", default-features = false }
futures = "0.3.34"
hex = "0.4.3"
hkdf = "0.13.0"
p256 = { version = "0.14.0", features = ["ecdh", "ecdsa"] }
percent-encoding = "2.3.2"
proptest = "1.7.0"
rand = "0.9.5"
reqwest = { version = "0.13.5", default-features = false }
rusqlite = "0.42.0"
rust_decimal = "1.43.0"
serde = "1.0.229"
serde_json = "1.0.154"
sha2 = "0.11.1"
static_assertions = "1.1.0"
tempfile = "3.27.0"
thiserror = "2.0.21"
tokio = "1.54.1"
tokio-tungstenite = "0.30.0"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["ansi", "fmt", "std"] }
url = "2.5.9"
wiremock = "0.6.5"
zeroize = "1.9.1"
pi-agent = { path = "crates/agent", version = "0.1.0" }
pi-ai = { path = "crates/ai", version = "0.1.0" }
pi-approval = { path = "crates/approval", version = "0.1.0" }
pi-backup = { path = "crates/backup", version = "0.1.0" }
pi-data = { path = "crates/data", version = "0.1.0" }
pi-exec = { path = "crates/exec", version = "0.1.0" }
pi-gate = { path = "crates/gate", version = "0.1.0" }
pi-journal = { path = "crates/journal", version = "0.1.0" }
pi-knowledge = { path = "crates/knowledge", version = "0.1.0" }
pi-market = { path = "crates/market", version = "0.1.0" }
pi-notify = { path = "crates/notify", version = "0.1.0" }
pi-office = { path = "crates/office", version = "0.1.0" }
pi-paper = { path = "crates/paper", version = "0.1.0" }
pi-rules = { path = "crates/rules", version = "0.1.0" }
pi-secrets = { path = "crates/secrets", version = "0.1.0" }
pi-store = { path = "crates/store", version = "0.1.0" }
pi-template = { path = "crates/template", version = "0.1.0" }
pi-trigger = { path = "crates/trigger", version = "0.1.0" }
